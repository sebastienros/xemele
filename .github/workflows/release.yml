name: Local release evidence (no publication)
on:
  workflow_dispatch:
  push:
    branches: [codex/m9-os-validation]
permissions:
  contents: read
concurrency:
  group: xemele-m9-platform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distribution:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve hash-pinned fixture bytes during checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cumulative unit correctness and actual package/trim/NativeAOT consumption
        run: python tools/Packaging/verify.py --rid ${{ matrix.rid }} --unit-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.rid }}
          path: artifacts/M9-distribution/summary.json
          if-no-files-found: error
          retention-days: 7
