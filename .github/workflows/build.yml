name: Build and validate
on:
  push:
    branches-ignore: [codex/m9-os-validation, codex/m9-final-os-validation]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve hash-pinned fixture bytes during checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate planning records
        run: python tools/planning/tasks.py validate
      - name: Test fragment discovery
        run: python -B -m unittest discover -s tests/Xemele.TestUtilities/Build -p 'test_*.py' -v
      - name: Provision pinned corpus bytes for clean-checkout checks
        run: python -B tools/ApiBaseline/prepare_corpus.py
      - name: Discover API and corpus fragments
        run: python -B tools/ApiBaseline/discover.py
      - name: Restore
        run: dotnet restore Xemele.slnx --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - name: Build
        run: dotnet build Xemele.slnx -c Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - name: Compare compiled runtime API and verify foundation contracts
        run: python -B docs/reports/M0-api-wiring/verify.py
      - name: Prepare pinned runtime and independent reference engines
        run: |
          python -B tools/ApiBaseline/prepare_runtime.py
          python -B tools/ApiBaseline/prepare_references.py
      - name: Discover and execute MTP tests and verify failure exit codes
        env:
          DOTNET_TieredCompilation: '0'
          DOTNET_TieredPGO: '0'
          DOTNET_ReadyToRun: '0'
          DOTNET_gcServer: '0'
          DOTNET_GCConcurrent: '0'
        run: python -B docs/reports/M0-tests-mtp/check_runner.py
      - name: Verify focused corpus MTP tests and root offline CLI
        run: python -B docs/reports/M0-corpora-wiring/check_cli.py
      - name: Verify bootstrap corpus bytes and independent expectations
        run: python -B tests/Xemele.TestUtilities/Corpora/verify_bootstrap.py
      - name: Pack runtime
        run: dotnet pack src/Xemele/Xemele.csproj -c Release --no-build --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/packages
            artifacts/M0-corpora-wiring
            artifacts/M0-api-wiring
          if-no-files-found: ignore
