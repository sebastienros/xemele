name: Refresh test data
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-test-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONUTF8: '1'
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          check-latest: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install independent reference build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake build-essential
      - name: Verify maintenance and release tooling contracts
        run: python -B -m unittest discover -s tests/Xemele.TestUtilities/Build -p 'test_*.py' -v
      - name: Download and verify pinned upstream corpus
        run: python -B tools/ApiBaseline/prepare_corpus.py
      - name: Build independent pinned reference engines
        run: python -B tools/ApiBaseline/prepare_references.py
      - name: Capture independent results and provenance
        run: python -B tools/Validation/reference_snapshots.py
      - name: Build managed checks and verify API contracts
        run: |
          dotnet build Xemele.slnx -c Release
          dotnet run --project tools/Build -c Release --no-build --no-restore -- verify
          python -B tools/ApiBaseline/verify.py
          python -B tools/Validation/check_corpus_cli.py
          python -B tests/Xemele.TestUtilities/Corpora/verify_bootstrap.py
      - name: Compare live independent references with authoritative expectations
        env:
          XEMELE_LIVE_REFERENCES: '1'
        run: dotnet test --project tests/Xemele.Differential.Tests -c Release --no-build --no-restore --filter-class Xemele.Differential.Tests.RelaxNg.ReferenceTests
      - name: Validate recorded reference results
        run: dotnet test --project tests/Xemele.Differential.Tests -c Release --no-build --no-restore --filter-class Xemele.Differential.Tests.RelaxNg.ReferenceTests
      - name: Propose reviewed reference-data updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/test-data
          title: Refresh independent test reference results
          body: |
            Rebuilt the pinned independent engines and verified the upstream corpus hashes.
            These are recorded reference outcomes, not results generated by Xemele.
            Upstream revisions, authoritative expectations and limitation ledgers require explicit review.
            Normal builds continue to download the immutable hash-pinned corpus, not mutable workflow artifacts.
          commit-message: |
            Refresh independent test reference results

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          add-paths: tests/corpora/relaxng/reference-results-*.json
          draft: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: independent-reference-provenance
          path: |
            artifacts/M9-ci-maintenance/references/reference-build.json
            tests/corpora/relaxng/reference-results-*.json
            artifacts/api
            artifacts/corpus-cli
