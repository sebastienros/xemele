[package]
name = "xemele-release-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
xmloxide = { git = "https://github.com/jonwiggins/xmloxide", rev = "555055f1ea6bf9944488fd96415b6f03b5b43696", default-features = false }
serde_json = "=1.0.149"

[profile.release]
opt-level = 3
debug = false
strip = "none"
lto = false
codegen-units = 16
panic = "unwind"
