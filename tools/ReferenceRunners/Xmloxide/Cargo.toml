[package]
name = "xemele-xmloxide-reference"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
xmloxide = { git = "https://github.com/jonwiggins/xmloxide", rev = "555055f1ea6bf9944488fd96415b6f03b5b43696", default-features = false }
serde_json = "=1.0.149"
base64 = "=0.22.1"
url = "=2.5.8"

[profile.release]
opt-level = 3
debug = false
strip = "none"
lto = false
codegen-units = 16
panic = "unwind"

[[bin]]
name = "raw-probe"
path = "probes/raw_probe.rs"
